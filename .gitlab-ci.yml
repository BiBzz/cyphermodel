stages:
  - docs

.docs: &docs
  stage: docs
  image: ghcr.io/astral-sh/uv:0.7.13-python3.12-bookworm-slim
  script:
    - uv sync --locked --group docs
    - uv run zensical build --clean

docs:
  <<: *docs
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

pages:
  <<: *docs
  pages:
    publish: site
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
