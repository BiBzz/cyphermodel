site_name: CypherModel
site_description: CypherModel, graph databases in Python, fully async and strongly typed.
site_url: https://cyphermodel.businessagile.eu/
theme:
  variant: classic
  name: material
  custom_dir: overrides
  font: false
  palette:
  - media: "(prefers-color-scheme)"
    toggle:
      icon: material/lightbulb-auto
      name: Switch to light mode
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: teal
    accent: amber
    toggle:
      icon: material/lightbulb
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: teal
    accent: amber
    toggle:
      icon: material/lightbulb-outline
      name: Switch to system preference
  features:
  - content.code.annotate
  - content.code.copy
  - navigation.footer
  - navigation.indexes
  - navigation.instant
  - navigation.tabs
  - navigation.top
  - navigation.tracking
  - search.highlight
  - search.suggest
  - toc.follow
  icon:
    repo: simple/gitlab
  logo: img/icon-white.svg
  favicon: img/icon-white.svg
  language: en
repo_name: businessagile/libraries/cyphermodel
repo_url: https://gitlab.com/businessagile/libraries/cyphermodel
edit_uri: ""
copyright: >-
  <span class="ba-credit">Made by <a href="https://businessagile.eu" target="_blank" rel="noopener"><img src="/img/business-agile-logo.png" alt="Business Agile" height="40"></a>, European custom development studio</span>
  · <a href="/about/legal-notice/">Legal notice</a> · <a href="/about/privacy/">Privacy and cookies</a>

nav:
  - CypherModel: index.md
  - features.md
  - design.md
  - About:
    - about/legal-notice.md
    - about/privacy.md

markdown_extensions:
  abbr: null
  attr_list: null
  md_in_html: null
  tables: null
  toc:
    permalink: true
  admonition: null
  pymdownx.details: null
  pymdownx.superfences: null
  pymdownx.highlight:
    line_spans: __span
  pymdownx.inlinehilite: null
  pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji
    emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - css/custom.css
